<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Time Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Got Charm Trinkets</h1>
    </header>

    <section class="container">  

        <div class="formhead">
            <h1>Welcome to GotCharm! </h1>
        </div>

        <br><br>

        <div>

            <input type="text" placeholder="Enter Code(6 numbers)" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" id="verify">
            
            <br>

            <div class="logandreg">
                <button>Verify</button>
            </div>
        </div>
            
    </section>

    <script src="backend/otp.js"></script>
</body>
</html>
